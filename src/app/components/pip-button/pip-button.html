<button
  (click)="toggle()"
  [title]="label()"
  [aria-label]="label()"
  class="hidden h-9 w-9 shrink-0 items-center justify-center rounded-full transition hover:bg-neutral-800 md:flex"
  [class.text-white]="pip.active()"
  [class.text-neutral-400]="!pip.active()"
>
  @if (pip.active()) {
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="2" />
      <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h6A1.5 1.5 0 0 1 12 7.5v6A1.5 1.5 0 0 1 10.5 15h-6A1.5 1.5 0 0 1 3 13.5v-6z" />
    </svg>
  } @else {
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="2" />
      <path d="M10 9h8" />
      <path d="M15 6l3 3-3 3" />
    </svg>
  }
</button>
