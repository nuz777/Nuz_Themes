<div class="pointer-events-none fixed inset-x-0 bottom-24 z-[100] flex flex-col items-center gap-2 px-4">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      (click)="openToast(toast)"
      [class.cursor-pointer]="!!toast.route"
      class="pointer-events-auto flex w-full max-w-sm animate-[toast-in_.25s_ease] items-center gap-3 rounded-lg border border-neutral-700 bg-neutral-900/95 px-4 py-3 text-sm font-semibold text-white shadow-2xl shadow-black"
      [attr.role]="toast.route ? 'button' : null"
    >
      @if (toast.cover) {
        <img [src]="toast.cover" alt="" class="h-11 w-11 shrink-0 rounded-md bg-neutral-800 object-cover" />
      }
      <span class="min-w-0 flex-1">{{ toast.text }}</span>
      <button
        (click)="$event.stopPropagation(); toastService.dismiss(toast.id)"
        aria-label="Cerrar notificación"
        class="shrink-0 text-neutral-400 transition hover:text-white"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" class="fill-current">
          <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z" />
        </svg>
      </button>
    </div>
  }
</div>
