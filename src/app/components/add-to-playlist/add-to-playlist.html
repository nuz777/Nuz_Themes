<button
  (click)="toggle($event)"
  class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-neutral-400 transition hover:bg-neutral-800 hover:text-white"
  [attr.aria-label]="'Agregar ' + track().title + ' a una playlist'"
  title="Agregar a playlist"
>
  <svg width="18" height="18" viewBox="0 0 24 24" class="fill-none stroke-current" stroke-width="2" aria-hidden="true">
    <path d="M12 5v14M5 12h14" />
  </svg>
</button>

@if (open()) {
  <div
    class="fixed inset-0 z-[80] flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm"
    (click)="close($event)"
  >
    <section
      class="w-full max-w-sm rounded-2xl border border-white/10 bg-neutral-950 p-5 shadow-2xl shadow-black"
      (click)="$event.stopPropagation()"
    >
      <div class="mb-4 flex items-start justify-between gap-4">
        <div>
          <h2 class="text-base font-bold text-white">Agregar a playlist</h2>
          <p class="mt-1 truncate text-sm text-neutral-400">{{ track().title }}</p>
        </div>
        <button
          (click)="close($event)"
          class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-neutral-400 transition hover:bg-white/10 hover:text-white"
          aria-label="Cerrar"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" class="fill-current" aria-hidden="true">
            <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z" />
          </svg>
        </button>
      </div>

      @if (userPlaylists().length) {
        <div class="max-h-48 space-y-1 overflow-y-auto">
          @for (playlist of userPlaylists(); track playlist.id) {
            <div class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm text-neutral-200 transition hover:bg-white/5">
              <img [src]="playlist.cover" [alt]="playlist.name" class="h-9 w-9 rounded object-cover" />
              <span class="truncate">{{ playlist.name }}</span>
              <button
                (click)="addToPlaylist(playlist.id, $event)"
                [disabled]="isInPlaylist(playlist.trackIds)"
                class="ml-auto shrink-0 rounded-full border border-white/10 px-3 py-1 text-xs font-bold text-neutral-300 transition hover:bg-white/10 hover:text-white disabled:cursor-default disabled:border-emerald-400/30 disabled:text-emerald-300"
              >
                {{ isInPlaylist(playlist.trackIds) ? 'Agregada' : 'Agregar' }}
              </button>
            </div>
          }
        </div>
      } @else {
        <p class="rounded-lg bg-white/5 px-3 py-3 text-sm text-neutral-400">Todavía no tienes playlists personales.</p>
      }

      <form (submit)="createPlaylist($event)" class="mt-4 flex gap-2">
        <input
          name="playlistName"
          class="min-w-0 flex-1 rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-sm text-white outline-none placeholder:text-neutral-500 focus:border-white/30"
          placeholder="Nueva playlist..."
          maxlength="40"
        />
        <button class="rounded-lg bg-white px-3 py-2 text-sm font-bold text-black transition hover:bg-neutral-200">
          Crear
        </button>
      </form>
    </section>
  </div>
}
