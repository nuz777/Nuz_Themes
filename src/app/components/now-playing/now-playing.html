@if (audio.showNowPlaying()) {
  <div
    class="fixed inset-x-0 bottom-0 top-14 z-20 flex flex-col overflow-y-auto bg-black md:absolute md:inset-0"
    [style.background-image]="background()"
    (keydown)="onKeydown($event)"
    tabindex="-1"
    animate.leave="modal-leave"
  >
    <div class="flex min-h-full flex-col" animate.enter="modal-enter">
    <div class="flex items-center justify-between p-4 pb-2 sm:p-6 sm:pb-2">
      <div class="flex items-center gap-2 text-sm font-bold uppercase tracking-widest text-neutral-300">
        <span class="flex gap-[2px]">
          <span class="equalizer-bar"></span>
          <span class="equalizer-bar"></span>
          <span class="equalizer-bar"></span>
        </span>
        Reproduciendo
      </div>
      <button
        (click)="audio.closeNowPlaying()"
        class="flex h-9 w-9 items-center justify-center rounded-full bg-black/30 text-neutral-200 transition hover:bg-black/50 hover:text-white"
        aria-label="Cerrar"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" class="fill-current">
          <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z" />
        </svg>
      </button>
    </div>

    @for (track of currentTrackList(); track track.id) {
      <div class="flex min-h-0 flex-1 flex-col items-center px-4 pb-6 sm:px-6">
        <div class="my-auto flex w-full flex-col items-center gap-7">
          <div class="flex flex-col items-center gap-7" animate.enter="track-enter">
          <img
            [src]="track.cover"
            [alt]="track.title"
            class="h-52 w-52 max-h-[38dvh] rounded-xl bg-neutral-950 object-cover shadow-2xl shadow-black sm:h-64 sm:w-64"
          />

          <div class="w-full max-w-xl text-center">
            <h2 class="truncate text-2xl font-black text-white sm:text-3xl">{{ track.title }}</h2>
            <p class="mt-1 truncate text-base text-neutral-200 sm:text-lg">{{ track.artist }}</p>
          </div>
        </div>

        <div class="w-full max-w-xl">
          <input
            type="range"
            min="0"
            [max]="audio.duration() || 0"
            step="0.1"
            [value]="audio.currentTime()"
            (input)="onSeek($event)"
            class="player-range w-full"
            [style.--progress]="progressStyle()"
            aria-label="Progreso"
          />
          <div class="mt-1 flex items-center justify-between text-xs font-semibold text-neutral-200">
            <span class="tabular-nums">{{ formatTime(audio.currentTime()) }}</span>
            <span class="tabular-nums">{{ formatTime(audio.duration()) }}</span>
          </div>
        </div>

        <div class="flex items-center gap-6">
          <button
            (click)="audio.toggleShuffle()"
            [class.text-white]="audio.shuffle()"
            [class.text-neutral-300]="!audio.shuffle()"
            class="transition hover:text-white"
            aria-label="Aleatorio"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" class="fill-current">
              <path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z" />
            </svg>
          </button>

          <button
            (click)="audio.prev()"
            class="text-neutral-300 transition hover:text-white"
            aria-label="Anterior"
          >
            <svg width="40" height="40" viewBox="0 0 24 24" class="fill-current">
              <path d="M6 6h2v12H6V6zm3.5 6 8.5 6V6l-8.5 6z" />
            </svg>
          </button>

          <button
            (click)="audio.togglePlay()"
            class="flex h-16 w-16 items-center justify-center rounded-full bg-white text-black transition hover:scale-105"
            aria-label="Reproducir o pausar"
          >
            @if (audio.isPlaying()) {
              <svg width="30" height="30" viewBox="0 0 24 24" class="fill-current">
                <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z" />
              </svg>
            } @else {
              <svg width="30" height="30" viewBox="0 0 24 24" class="fill-current translate-x-0.5">
                <path d="M8 5v14l11-7L8 5z" />
              </svg>
            }
          </button>

          <button
            (click)="audio.next()"
            class="text-neutral-300 transition hover:text-white"
            aria-label="Siguiente"
          >
            <svg width="40" height="40" viewBox="0 0 24 24" class="fill-current">
              <path d="M16 6h2v12h-2V6zM6 18l8.5-6L6 6v12z" />
            </svg>
          </button>

          <button
            (click)="audio.toggleRepeat()"
            [class.text-white]="audio.repeat() !== 'off'"
            [class.text-neutral-300]="audio.repeat() === 'off'"
            class="relative transition hover:text-white"
            aria-label="Repetir"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" class="fill-current">
              <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" />
            </svg>
            @if (audio.repeat() === 'one') {
              <span class="absolute -top-1 right-0 text-[8px] font-bold text-white">1</span>
            }
          </button>
          </div>
        </div>
      </div>
    } @empty {
      <div class="flex flex-1 items-center justify-center text-neutral-300">
        No hay ninguna canción en reproducción.
      </div>
    }
    </div>
  </div>
}
