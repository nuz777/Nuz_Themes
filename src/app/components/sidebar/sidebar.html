<aside class="flex h-full w-72 shrink-0 flex-col gap-2 rounded-none bg-neutral-950 md:rounded-lg">
  <nav class="rounded-lg p-4 md:p-6">
    <a routerLink="/" class="mb-6 flex items-center gap-2 text-white">
      <img src="favicom.ico" alt="Nuz_Themes" class="h-10 w-10 shrink-0 rounded object-cover md:h-12 md:w-12" />
      <span class="font-pixel text-base tracking-tight text-white md:text-xl">Nuz_Themes</span>
    </a>

    <ul class="space-y-1">
      <li>
        <a
          routerLink="/"
          routerLinkActive="bg-neutral-900 text-white"
          class="flex items-center gap-4 rounded-md px-3 py-2 font-bold text-neutral-400 transition hover:text-white"
        >
          <svg width="24" height="24" viewBox="0 0 24 24" class="fill-current">
            <path d="M12 3 2 12h3v9h6v-6h2v6h6v-9h3L12 3z" />
          </svg>
          <span>Inicio</span>
        </a>
      </li>
      <li>
        <a
          routerLink="/playlists"
          routerLinkActive="bg-neutral-900 text-white"
          class="flex items-center gap-4 rounded-md px-3 py-2 font-bold text-neutral-400 transition hover:text-white"
        >
          <svg width="24" height="24" viewBox="0 0 24 24" class="fill-current">
            <rect x="3" y="5" width="18" height="2" rx="1" />
            <rect x="3" y="11" width="18" height="2" rx="1" />
            <rect x="3" y="17" width="12" height="2" rx="1" />
          </svg>
          <span>Tus Playlists</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="flex min-h-0 flex-1 flex-col rounded-lg p-4 md:p-6">
    <button
      routerLink="/playlists"
      class="mb-4 flex items-center gap-4 font-bold text-neutral-400 transition hover:text-white"
    >
      <svg width="24" height="24" viewBox="0 0 24 24" class="fill-current">
        <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm-1 5a1 1 0 1 1 2 0v5.4l3.6 1.8a1 1 0 1 1-.9 1.8l-4.3-2.15a1 1 0 0 1-.4-.4V7zm9 5a9 9 0 1 1-9-9 9 9 0 0 1 9 9z" />
      </svg>
      <span>Tu biblioteca</span>
    </button>

    <div class="mb-2 flex items-center justify-between text-neutral-400">
      <span class="text-xs font-semibold tracking-wide uppercase">Playlists</span>
    </div>

    <ul class="min-h-0 flex-1 space-y-1 overflow-y-auto">
      @for (playlist of playlists(); track playlist.id) {
        <li>
          <a
            [routerLink]="['/playlist', playlist.id]"
            class="flex items-center gap-3 rounded-md p-2 text-sm text-neutral-400 transition hover:bg-neutral-900 hover:text-white"
          >
            <img [src]="playlist.cover" [alt]="playlist.name" class="h-12 w-12 rounded object-cover" loading="lazy" />
            <span class="line-clamp-2">{{ playlist.name }}</span>
          </a>
        </li>
      }
    </ul>
  </div>
</aside>
