@let status = offline.status()[track().id];

<button
  (click)="toggle()"
  [title]="statusLabel()"
  [aria-label]="statusLabel()"
  class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-neutral-400 transition hover:bg-neutral-800 hover:text-white disabled:cursor-wait disabled:opacity-60"
  [class.text-emerald-400]="status === 'downloaded'"
  [class.text-red-400]="status === 'error'"
  [disabled]="offline.status()[track().id] === 'downloading'"
>
  @if (status === 'downloading') {
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" class="animate-spin">
      <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" class="opacity-25" />
      <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
    </svg>
  } @else if (status === 'downloaded') {
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M3 6h18" />
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
      <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
      <path d="M10 11v6" />
      <path d="M14 11v6" />
    </svg>
  } @else {
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2" />
      <path d="M12 12v9" />
      <path d="m8 17 4 4 4-4" />
    </svg>
  }
</button>
