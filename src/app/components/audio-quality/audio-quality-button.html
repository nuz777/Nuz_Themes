<!-- Botón tuerquita con transparencia y blur para abrir el selector de calidad de audio -->
<button
  type="button"
  (click)="open()"
  [attr.aria-label]="'Calidad de audio: ' + currentQualityLabel"
  [title]="'Calidad de audio: ' + currentQualityLabel"
  class="group relative inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-white/20 bg-white/10 text-neutral-200 shadow-md shadow-black/40 backdrop-blur-md transition-all duration-200 hover:border-white/40 hover:bg-white/20 hover:scale-105 hover:text-white active:scale-95 cursor-pointer"
>
  <!-- Icono tuerquita (engranaje / settings) -->
  <svg
    class="h-4.5 w-4.5 shrink-0 text-neutral-300 transition-transform duration-300 group-hover:rotate-45 group-hover:text-white"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
    <circle cx="12" cy="12" r="3" />
  </svg>

  <!-- Indicador sutil de calidad (punto de color con glow) -->
  <span
    class="absolute bottom-0.5 right-0.5 h-2 w-2 rounded-full border border-black/70 shadow-sm"
    [class.bg-emerald-400]="currentQuality === 'baja'"
    [class.shadow-[0_0_6px_#34d399]]="currentQuality === 'baja'"
    [class.bg-sky-400]="currentQuality === 'media'"
    [class.shadow-[0_0_6px_#38bdf8]]="currentQuality === 'media'"
    [class.bg-amber-400]="currentQuality === 'alta'"
    [class.shadow-[0_0_6px_#fbbf24]]="currentQuality === 'alta'"
  ></span>

  <!-- Texto accesible -->
  <span class="sr-only">
    @switch (currentQuality) {
      @case ('baja') { Baja (64k) }
      @case ('media') { Media (128k) }
      @case ('alta') { Alta (HD) }
    }
  </span>
</button>
