<section class="p-4 sm:p-6">
  <header class="mb-6 flex items-end justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-white sm:text-3xl">Tu biblioteca</h1>
      <p class="mt-1 text-neutral-400">Todas tus playlists guardadas.</p>
    </div>
    <button
      (click)="creating.set(!creating())"
      class="flex shrink-0 items-center gap-2 rounded-full bg-white px-4 py-2 text-sm font-bold text-black transition hover:bg-neutral-200"
    >
      <span class="text-lg leading-none">+</span>
      Nueva playlist
    </button>
  </header>

  @if (creating()) {
    <form
      (submit)="createPlaylist($event)"
      class="mb-6 flex flex-col gap-2 rounded-xl border border-white/10 bg-white/[0.03] p-4 sm:flex-row"
    >
      <input
        name="playlistName"
        class="min-w-0 flex-1 rounded-lg border border-white/10 bg-black/30 px-3 py-2 text-sm text-white outline-none placeholder:text-neutral-500 focus:border-white/30"
        placeholder="Nombre de tu playlist"
        maxlength="40"
        autofocus
      />
      <button class="rounded-lg bg-white px-4 py-2 text-sm font-bold text-black transition hover:bg-neutral-200">
        Crear
      </button>
    </form>
  }

  <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5">
    @for (playlist of tracksService.playlists(); track playlist.id) {
      <app-playlist-card [playlist]="playlist" />
    }
  </div>

  <footer class="mt-12 flex flex-col items-center gap-3 border-t border-neutral-800 pt-8 text-center">
    <img src="favicom.ico" alt="Nuz_Themes" class="h-12 w-12 rounded object-cover" />
    <p class="font-pixel text-xs text-white">Nuz_Themes</p>
    <p class="mt-1 max-w-sm text-xs leading-relaxed text-neutral-400">
      Proyecto personal de Nuz, desarrollado con dedicación y sin fines de lucro.
    </p>
  </footer>
</section>
