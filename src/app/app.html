<div class="flex h-dvh flex-col bg-black text-white">
  <header
    class="sticky top-0 z-50 flex h-14 shrink-0 items-center justify-between border-b border-neutral-900 bg-black px-4 md:hidden"
  >
    <a routerLink="/" class="flex items-center gap-2">
      <img src="favicom.ico" alt="Nuz_Themes" class="h-8 w-8 shrink-0 rounded object-cover" />
      <span class="font-pixel text-sm tracking-tight">Nuz_Themes</span>
    </a>
    <div class="flex items-center gap-1">
      <button
        (click)="toggleFullscreen()"
        class="flex h-9 w-9 items-center justify-center rounded-md text-neutral-300 transition hover:bg-neutral-900 hover:text-white"
        [attr.aria-label]="isFullscreen() ? 'Salir de pantalla completa' : 'Pantalla completa'"
        [attr.aria-pressed]="isFullscreen()"
      >
        <svg width="24" height="24" viewBox="0 0 24 24" class="fill-current">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
        </svg>
      </button>
      <button
        #headerMenuToggle
        (click)="sidebarOpen.set(!sidebarOpen())"
        class="flex h-9 w-9 items-center justify-center rounded-md text-neutral-300 transition hover:bg-neutral-900 hover:text-white"
        aria-label="Abrir menú"
      >
        <svg width="24" height="24" viewBox="0 0 24 24" class="fill-current">
          <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z" />
        </svg>
      </button>
    </div>
  </header>

  <div class="relative flex min-h-0 flex-1 gap-2 p-2 pb-0">
    @if (sidebarOpen()) {
      <div class="fixed inset-0 z-30 bg-black/70 md:hidden" (click)="sidebarOpen.set(false)"></div>
    }

    <button
      #sidebarToggle
      class="absolute left-1.5 top-1.5 z-[55] hidden h-9 w-9 items-center justify-center rounded-md border border-neutral-800 bg-neutral-950/90 text-neutral-300 shadow-lg shadow-black/40 backdrop-blur transition hover:bg-neutral-900 hover:text-white md:flex"
      (click)="sidebarCollapsed.set(!sidebarCollapsed())"
      [attr.aria-label]="sidebarCollapsed() ? 'Mostrar menú' : 'Ocultar menú'"
    >
      @if (sidebarCollapsed()) {
        <svg width="20" height="20" viewBox="0 0 24 24" class="fill-current">
          <path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12l4.58-4.59z" />
        </svg>
      } @else {
        <svg width="20" height="20" viewBox="0 0 24 24" class="fill-current">
          <path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z" />
        </svg>
      }
    </button>

    <div
      #sidebarWrapper
      class="fixed inset-y-0 left-0 z-40 w-72 overflow-hidden bg-neutral-950 transition-transform duration-300 md:relative md:z-40 md:translate-x-0 md:bg-transparent md:transition-all"
      [class.-translate-x-full]="!sidebarOpen()"
      [class.md:w-0]="sidebarCollapsed()"
      [class.md:w-72]="!sidebarCollapsed()"
    >
      <app-sidebar [playlists]="tracksService.playlists()" />
    </div>

    <main
      class="relative min-w-0 min-h-0 flex-1 rounded-lg bg-neutral-950"
      [style.overflow]="audio.showNowPlaying() ? 'hidden' : 'auto'"
    >
      <div class="h-full" [class.invisible]="audio.showNowPlaying()">
        <router-outlet />
      </div>
      <app-now-playing />
    </main>
  </div>
  <app-player-bar />
  <app-toast />
  <app-favorites-fab />

  @if (audio.loading()) {
    <div class="loading-screen fixed inset-0 z-[70] flex items-center justify-center">
      <div class="flex flex-col items-center gap-4 rounded-2xl border border-white/10 bg-neutral-950/90 px-10 py-8 shadow-2xl shadow-black backdrop-blur-md">
        <div class="load-waves" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <p class="text-sm font-semibold tracking-widest uppercase text-neutral-200">Cargando...</p>
      </div>
    </div>
  }
</div>
