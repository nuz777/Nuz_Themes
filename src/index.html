<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nuz_Themes</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicom.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    #boot-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #000;
    }

    #boot-loader.is-hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .boot-logo {
      width: 88px;
      height: 88px;
      border-radius: 16px;
      animation: boot-pulse 1.6s ease-in-out infinite;
    }

    .boot-dots {
      display: flex;
      gap: 8px;
    }

    .boot-dots span {
      width: 10px;
      height: 10px;
      border-radius: 9999px;
      background: #fff;
      animation: boot-hop 1.1s ease-in-out infinite;
    }

    .boot-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .boot-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes boot-hop {
      0%,
      100% {
        transform: translateY(0);
        opacity: 0.4;
      }
      50% {
        transform: translateY(-10px);
        opacity: 1;
      }
    }

    @keyframes boot-pulse {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.06);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot-logo,
      .boot-dots span {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="boot-loader" aria-hidden="true">
    <img src="favicom.ico" alt="" class="boot-logo" />
    <div class="boot-dots">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
  <app-root></app-root>
</body>
</html>
